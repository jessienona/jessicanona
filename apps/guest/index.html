<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F1EC" />
  <title>Tether — Gallery</title>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Gallery" />
  <!-- No web app manifest here on purpose: each gallery lives at its own
       /g/:slug URL, so "Add to Home Screen" should bookmark *that* gallery
       (what Safari does from apple-touch-icon + these meta tags alone),
       not a fixed start_url a shared manifest would imply. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #F4F1EC;
      overscroll-behavior-y: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
